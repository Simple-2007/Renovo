{% load static %}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Renovo{% endblock %}</title>
<script>
  // Тему ставим до отрисовки, иначе при загрузке мигает светлым.
  (() => {
    try {
      const saved = localStorage.getItem('renovo-theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) { /* приватный режим — остаёмся на системной теме */ }
  })();
</script>
<style>
  /* Токены светлой темы. Значения — из проверенной палитры дата-виза:
     категориальные слоты назначаются датчикам по порядку и никогда
     не переназначаются, поэтому «синий» всегда один и тот же датчик. */
  :root {
    color-scheme: light;

    --surface:        #fcfcfb;   /* карточки и поле графика */
    --page:           #f9f9f7;
    --ink:            #0b0b0b;
    --ink-secondary:  #52514e;
    /* Приглушённый текст на светлом фоне даёт 4.88:1 — мелкие подписи
       (время замера, «нет данных», деления оси) обязаны проходить 4.5:1.
       Эталонный #898781 давал 3.5:1 и для текста не годится. */
    --ink-muted:      #726f68;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11, 11, 11, 0.10);
    --hover:          rgba(11, 11, 11, 0.04);
    --focus:          #2a78d6;

    --status-good:    #0ca30c;
    --status-critical:#d03b3b;
    /* Крайняя точка шкалы подкраски значения. Не берём статусный красный:
       он рассчитан на плашки, а как текст даёт лишь 4.68:1. Этот — 6.37:1. */
    --value-hot:      #b3261e;

    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #4a3aa7;
    --series-8: #e34948;

    --radius: 10px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Тёмная тема — не автоинверсия, а те же восемь тонов, подобранные
     под тёмную подложку и проверенные валидатором отдельно. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;

      --surface:        #1a1a19;
      --page:           #0d0d0d;
      --ink:            #ffffff;
      --ink-secondary:  #c3c2b7;
      --ink-muted:      #898781;
      --grid:           #2c2c2a;
      --axis:           #383835;
      --border:         rgba(255, 255, 255, 0.10);
      --hover:          rgba(255, 255, 255, 0.06);
      --focus:          #3987e5;
      --value-hot:      #f08a80;   /* 7.18:1 на тёмной подложке */

      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;

    --surface:        #1a1a19;
    --page:           #0d0d0d;
    --ink:            #ffffff;
    --ink-secondary:  #c3c2b7;
    --ink-muted:      #898781;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --border:         rgba(255, 255, 255, 0.10);
    --hover:          rgba(255, 255, 255, 0.06);
    --focus:          #3987e5;
    --value-hot:      #f08a80;   /* 7.18:1 на тёмной подложке */

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }

  * { box-sizing: border-box; }

  /* Клавиатурная навигация должна быть видна. Кольцо только на :focus-visible,
     чтобы не мигало при обычном клике мышью. */
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* Уважаем системную настройку «меньше движения». */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  @media (max-width: 480px) { .wrap { padding: 0 14px; } }

  header.site {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header.site .wrap { display: flex; align-items: center; gap: 28px; height: 60px; }
  .brand {
    font-weight: 700; font-size: 17px; letter-spacing: .08em;
    text-decoration: none; color: var(--ink);
  }
  nav.site { display: flex; gap: 20px; flex-wrap: wrap; margin-right: auto; }
  nav.site a {
    color: var(--ink-secondary); text-decoration: none; font-size: 14px;
    transition: color .18s ease;
  }
  nav.site a:hover { color: var(--ink); }

  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0; cursor: pointer;
    background: transparent; color: var(--ink-secondary);
    border: 1px solid var(--border); border-radius: 8px;
  }
  .theme-toggle { transition: background-color .18s ease, color .18s ease, border-color .18s ease; }
  .theme-toggle:hover { background: var(--hover); color: var(--ink); }
  .theme-toggle svg { width: 17px; height: 17px; }
  .theme-toggle .icon-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .icon-light { display: none; }
    :root:not([data-theme="light"]) .theme-toggle .icon-dark { display: block; }
  }
  :root[data-theme="dark"] .theme-toggle .icon-light { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-dark { display: block; }

  main { padding: 32px 0 72px; }
  h1 { font-size: 25px; font-weight: 650; margin: 0 0 2px; letter-spacing: -0.01em; }
  h2 { font-size: 15px; font-weight: 600; margin: 0; }
  .sub { color: var(--ink-secondary); margin: 0; font-size: 14px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  /* Состояние связи: точка + подпись, никогда не один цвет —
     иначе смысл теряется для тех, кто цвет не различает. */
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 500; padding: 5px 12px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--ink-secondary);
    white-space: nowrap;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-muted); flex: none; }
  .badge.online .dot { background: var(--status-good); }
  .badge.offline .dot { background: var(--status-critical); }

  footer.site {
    border-top: 1px solid var(--border);
    color: var(--ink-muted); font-size: 13px; padding: 20px 0;
  }
  a { color: var(--series-1); }
  code {
    background: var(--hover); padding: 2px 6px; border-radius: 4px;
    font-size: 13px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="/">RENOVO</a>
    <nav class="site">
      <a href="/">Мониторинг</a>
      {% for s in nav_sections %}<a href="{{ s.get_absolute_url }}">{{ s.title }}</a>{% endfor %}
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button"
            aria-label="Переключить тему" title="Переключить тему">
      <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.1 5.1l1.4 1.4M17.5 17.5l1.4 1.4M18.9 5.1l-1.4 1.4M6.5 17.5l-1.4 1.4"/>
      </svg>
      <svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a6.8 6.8 0 0 0 9.5 9.5z"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>

<footer class="site">
  <div class="wrap">Renovo &middot; контур мониторинга температуры</div>
</footer>

<script>
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const root = document.documentElement;
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const current = root.getAttribute('data-theme') || (systemDark ? 'dark' : 'light');
    const next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('renovo-theme', next); } catch (e) { /* приватный режим */ }
    // График держит цвета в канве, CSS их не достаёт — перекрашиваем вручную.
    window.dispatchEvent(new CustomEvent('renovo:themechange'));
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
